[project]
name = "avito-parser"
version = "2.1.0"
description = "Раз в час смотрит выдачу Avito по ссылке и присылает новые объявления письмом"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "camoufox[geoip]==0.5.8",
    "beautifulsoup4>=4.15,<5",
    "lxml>=6.1,<7",
    "PyYAML>=6.0,<7",
    "Flask>=3.1,<4",
    "waitress>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avito"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["avito"]
