[project]
name = "avito-parser"
version = "1.0.0"
description = "Следит за выдачей Avito и присылает новые объявления"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "camoufox[geoip]==0.5.5",
    "playwright==1.60.0",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.3,<7",
    "dateparser>=1.2,<2",
    "pydantic-settings>=2.6,<3",
    "PyYAML>=6.0,<7",
    "APScheduler>=3.11,<4",
    "apprise>=1.9,<2",
    "Flask>=3.1,<4",
    "waitress>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1"]

[project.scripts]
avito = "avito.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avito"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["avito"]
