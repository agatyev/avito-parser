services:
  avito:
    build:
      context: .
      args:
        VCS_REF: "${VCS_REF:-unknown}"
    image: "avito-parser:${AVITO_IMAGE_TAG:-2.2.0}"
    container_name: avito-parser
    restart: unless-stopped
    init: true
    user: "1000:1000"
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${AVITO_PORT:-8080}:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    shm_size: 1gb
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
